spring.application.name=painel-servidor

server.port=${PORT:8080}

# =========================================================
# CONFIGURAÇÃO DO POSTGRESQL (RENDER)
# =========================================================
# Cole o 'External Database URL' do Render aqui (certifique-se de manter o ?sslmode=require no final)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-da8pccu7bikc73ctq6tg-a.oregon-postgres.render.com:5432/paineldb_postgres?sslmode=require}

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rooto}

# =========================================================
# CONFIGURAÇÕES DE JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true

